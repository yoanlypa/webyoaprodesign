# Configuración para Coolify / cualquier VPS con Nginx (el .htaccess solo vale en Apache/Hostinger compartido)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # HTML, CSS y JS siempre frescos tras cada despliegue
  location ~* \.(html|css|js|json)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
  }
  # Imágenes y fuentes: caché larga
  location ~* \.(webp|jpg|jpeg|png|svg|avif|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
  }
  # Demos de propuestas: visibles para los clientes, pero fuera de Google
  location ^~ /demos/ {
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ =404;
  }

  location / { try_files $uri $uri/ /index.html; }
}
